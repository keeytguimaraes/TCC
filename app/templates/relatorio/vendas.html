{% extends "base/base.html" %}

{% block titulo %}
Relatório de Vendas
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/acoes.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/relatorio.css') }}">
{% endblock %}

{% block conteudo %}

<div class="rl">

    <header class="rl-topo">
        <div>
            <h1 class="rl-titulo">Relatório de Vendas</h1>
            <p class="rl-subtitulo">Escolha o período e o tipo de venda para gerar o PDF.</p>
        </div>

        <a href="/relatorio" class="btn btn-cancelar">← Voltar</a>
    </header>

    <form
        class="rl-form-card"
        method="POST"
        action="/relatorio/vendas/pdf"
        target="_blank"
    >

        <div class="rl-campos">

            <div class="rl-campo">
                <label for="rl-data-inicial">Data Inicial</label>
                <input type="date" id="rl-data-inicial" name="data_inicial" required>
            </div>

            <div class="rl-campo">
                <label for="rl-data-final">Data Final</label>
                <input type="date" id="rl-data-final" name="data_final" required>
            </div>

            <div class="rl-campo rl-campo--cheio">
                <label for="rl-tipo-vendas">Tipo de Vendas</label>
                <select id="rl-tipo-vendas" name="tipo_vendas" required>
                    <option value="todas">Todas</option>
                    <option value="pagas">Apenas Pagas</option>
                    <option value="pendentes">Apenas Pendentes</option>
                </select>
            </div>

        </div>

        <div class="rl-acoes">
            <button type="submit" class="btn btn-salvar">Gerar PDF</button>
        </div>

    </form>

</div>

{% endblock %}
