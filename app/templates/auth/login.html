<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · SIGC</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">

</head>
<body class="login-page">

    <div class="login-shell">

        <div class="login-media" role="img" aria-label="Fachada do comércio">
            <img
                src="{{ url_for('static', filename='img/fachada-comercio.jpg') }}"
                alt="Fachada do estabelecimento"
                class="login-media__img"
            >
            <div class="login-media__scrim"></div>

            <div class="login-media__brand">
                <div class="login-media__mark">S</div>
                <span class="login-media__name">SIGC</span>
            </div>

            <div class="login-media__caption">
                <h2>Gestão comercial do seu jeito.</h2>
                <p>Estoque, vendas e caixa em um só lugar.</p>
            </div>
        </div>

        <main class="login-form-panel">

            <div class="login-card">

                <div class="login-card__mobile-brand">
                    <div class="login-media__mark">S</div>
                    <span class="login-media__name">SIGC</span>
                </div>

                <h1>Entrar</h1>
                <p class="login-card__subtitle">Acesse sua conta para continuar</p>

                {% if erro %}
                <div class="login-alert" role="alert">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 8v5"/>
                        <path d="M12 16.2v.1"/>
                    </svg>
                    <span>{{ erro }}</span>
                </div>
                {% endif %}

                <form class="login-form" method="POST" action="{{ url_for('login') }}" novalidate>

                    <div class="login-field">
                        <label for="usuario">Usuário</label>
                        <div class="login-input-wrap">
                            <svg class="login-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M2 6l10 7 10-7"/>
                            </svg>
                            <input
                                type="text"
                                id="usuario"
                                name="usuario"
                                placeholder="seu usuário"
                                value="{{ usuario_preenchido|default('') }}"
                                autocomplete="username"
                                autofocus
                                required
                            >
                        </div>
                    </div>

                    <div class="login-field login-field--password">
                        <label for="senha">Senha</label>
                        <div class="login-input-wrap">
                            <svg class="login-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            </svg>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="sua senha"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="login-toggle-senha" id="toggle-senha" aria-label="Mostrar senha" aria-pressed="false">
                                <svg class="icone-olho-aberto" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icone-olho-fechado" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M3 3l18 18"/>
                                    <path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c7 0 11 7 11 7a13.4 13.4 0 0 1-3.3 3.9M6.6 6.6C3.4 8.5 1 12 1 12s4 7 11 7a9.8 9.8 0 0 0 5.4-1.6"/>
                                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="login-form__row">
                        <label class="login-checkbox">
                            <input type="checkbox" name="lembrar_me">
                            Lembrar-me
                        </label>
                    </div>

                    <p class="login-form__ajuda">
                        Esqueceu sua senha? Entre em contato com o administrador do sistema para redefinir seu acesso.
                    </p>

                    <button type="submit" class="login-submit" id="botao-entrar">
                        <span class="login-submit__spinner" aria-hidden="true"></span>
                        <span class="login-submit__label">Entrar</span>
                    </button>

                </form>

                <div class="login-card__footer">
                    <strong>SIGC</strong> &middot; versão 1.0.0
                </div>

            </div>

        </main>

    </div>

    <script src="{{ url_for('static', filename='js/pages/login.js') }}"></script>

</body>
</html>
