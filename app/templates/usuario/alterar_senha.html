{% extends "base/base.html" %}

{% block titulo %}
Alterar Senha
{% endblock %}

{% block css %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/pages/usuarios.css') }}"
>
{% endblock %}

{% block conteudo %}

<div class="pagina-usuarios">

    <header class="usuarios-cabecalho">
        <div>
            <h1 class="usuarios-titulo">Alterar Senha</h1>
            <p class="usuarios-descricao">
                Defina uma nova senha para
                <strong>{{ usuario.nome }}</strong>.
            </p>
        </div>
    </header>

    <section class="usuarios-painel usuarios-painel-form">

        <form method="POST" class="usuarios-form">

            <div class="usuarios-campo">
                <label for="senha">Nova senha</label>

                <div class="campo-senha">

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Nova senha"
                        autocomplete="new-password"
                        required
                        autofocus
                    >

                    <button
                        type="button"
                        id="toggle-senha"
                        aria-label="Mostrar ou ocultar a senha"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>
            </div>

            <div class="usuarios-campo">
                <label for="confirmar_senha">Confirmar senha</label>

                <div class="campo-senha">

                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Confirmar senha"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="toggle-confirmar"
                        aria-label="Mostrar ou ocultar a confirmação da senha"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>
            </div>

            <div class="acoes-formulario">

                <a
                    href="{{ url_for('usuario') }}"
                    class="usuario-btn usuario-btn-outline"
                >
                    Voltar
                </a>

                <button
                    type="submit"
                    class="usuario-btn usuario-btn-primary"
                >
                    Salvar
                </button>

            </div>

        </form>

    </section>

</div>

{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='js/global/senha.js') }}"></script>

{% endblock %}
