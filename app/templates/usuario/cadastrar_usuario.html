{% extends "base/base.html" %}

{% block titulo %}
Cadastrar Usuário
{% endblock %}

{% block css %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/pages/usuarios.css') }}"
>
{% endblock %}

{% block conteudo %}

<div class="pagina-usuarios">

    <header class="usuarios-cabecalho">
        <div>
            <h1 class="usuarios-titulo">Cadastrar Usuário</h1>
            <p class="usuarios-descricao">
                Informe os dados de acesso do novo usuário.
            </p>
        </div>
    </header>

    <section class="usuarios-painel usuarios-painel-form">

        <form
            method="POST"
            action="/usuario/cadastrar"
            class="usuarios-form"
        >

            <div class="usuarios-campo">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Nome completo"
                    required
                    autofocus
                >
            </div>

            <div class="usuarios-campo">
                <label for="usuario">Usuário (login)</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Usuário"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="usuarios-campo">
                <label for="senha">Senha</label>

                <div class="campo-senha">

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Senha"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="toggle-senha"
                        aria-label="Mostrar ou ocultar a senha"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>
            </div>

            <div class="usuarios-campo">
                <label for="confirmar_senha">Confirmar senha</label>

                <div class="campo-senha">

                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Confirmar senha"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        id="toggle-confirmar"
                        aria-label="Mostrar ou ocultar a confirmação da senha"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>
            </div>

            <div class="usuarios-campo">
                <label for="perfil">Perfil de acesso</label>

                <select
                    id="perfil"
                    name="perfil"
                    required
                >

                    <option value="" disabled selected>
                        Selecione o perfil
                    </option>

                    <option value="administrador">
                        Administrador
                    </option>

                    <option value="gerente">
                        Gerente
                    </option>

                    <option value="funcionario">
                        Funcionário
                    </option>

                </select>
            </div>

            <div class="acoes-formulario">

                <a
                    href="/usuario"
                    class="usuario-btn usuario-btn-outline"
                >
                    Voltar
                </a>

                <button
                    type="submit"
                    class="usuario-btn usuario-btn-primary"
                >
                    Salvar
                </button>

            </div>

        </form>

    </section>

</div>

{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='js/global/senha.js') }}"></script>

{% endblock %}
