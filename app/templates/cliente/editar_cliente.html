{% extends "base/base.html" %}

{% block titulo %}
Editar Cliente
{% endblock %}

{% block css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/pages/cliente.css') }}"
>

{% endblock %}

{% block conteudo %}

<h1>Editar Cliente</h1>

<div class="card">

    <div class="card-header">

        <h2>Editar Cliente</h2>

    </div>

    <div class="card-body">

        <form
            method="POST"
            class="cliente-form"
        >

            <input
                type="text"
                name="nome"
                value="{{ cliente.nome }}"
                required
            >

            <div class="cliente-acoes">

                <button
                    type="submit"
                    class="button button-primary"
                >

                    <i class="fa-solid fa-floppy-disk"></i>

                    Salvar

                </button>

                <a
                    href="{{ url_for('cliente') }}"
                    class="button button-secondary"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Voltar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
