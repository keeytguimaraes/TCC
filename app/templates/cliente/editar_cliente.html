{% extends "base/base.html" %}

{% block titulo %}
Editar Cliente
{% endblock %}

{% block css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/pages/cliente.css') }}"
>

{% endblock %}

{% block conteudo %}

<div class="page-header">

    <h1>
        Editar Cliente
    </h1>

    <a
        href="{{ url_for('cliente') }}"
        class="button button-secondary"
    >
        <i class="fa-solid fa-arrow-left"></i>
        Voltar
    </a>

</div>

<div class="card card-cliente">

    <div class="card-body">

        <h2>
            <i class="fa-solid fa-user"></i>
            Cliente
        </h2>

        <div class="cliente-info">

            <span class="cliente-label">
                Nome Atual
            </span>

            <h3>
                {{ cliente.nome }}
            </h3>

        </div>

        <form
            method="POST"
            class="cliente-form-editar"
        >

            <div class="form-group">

                <label>
                    Alterar Nome
                </label>

                <input
                    type="text"
                    name="nome"
                    value="{{ cliente.nome }}"
                    required
                >

            </div>

            <div class="cliente-acoes">

                <button
                    type="submit"
                    class="button button-success"
                >
                    <i class="fa-solid fa-floppy-disk"></i>
                    Salvar Alterações
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
