{% extends "base/base.html" %}

{% block titulo %}
Editar Produto
{% endblock %}

{% block css %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/pages/produto.css') }}"
>

{% endblock %}

{% block conteudo %}

<div class="card">

    <div class="card-header">

        <h2>
            Editar Produto
        </h2>

    </div>

    <div class="card-body">

        <form
            action="/produto/atualizar/{{ produto.id }}"
            method="POST"
            class="produto-form"
        >

            <div class="form-group">

                <label>
                    Nome do produto
                </label>

                <input
                    type="text"
                    name="nome"
                    value="{{ produto.nome }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Categoria
                </label>

                <input
                    type="text"
                    name="categoria"
                    value="{{ produto.categoria }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Sabor
                </label>

                <input
                    type="text"
                    name="sabor"
                    value="{{ produto.sabor }}"
                    placeholder="Zero, Original, Queijo, Presunto..."
                >

            </div>

            <div class="form-group">

                <label>
                    Tipo da embalagem
                </label>

                <select
    name="tipo_embalagem"
    class="form-select"
>

                    <option value="Lata"
                        {% if produto.tipo_embalagem == 'Lata' %}selected{% endif %}
                    >
                        Lata
                    </option>

                    <option value="Garrafa"
                        {% if produto.tipo_embalagem == 'Garrafa' %}selected{% endif %}
                    >
                        Garrafa
                    </option>

                    <option value="Caixa"
                        {% if produto.tipo_embalagem == 'Caixa' %}selected{% endif %}
                    >
                        Caixa
                    </option>

                    <option value="Pacote"
                        {% if produto.tipo_embalagem == 'Pacote' %}selected{% endif %}
                    >
                        Pacote
                    </option>

                    <option value="Saco"
                        {% if produto.tipo_embalagem == 'Saco' %}selected{% endif %}
                    >
                        Saco
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label>
                    Volume / Peso
                </label>

                <input
                    type="text"
                    name="volume"
                    value="{{ produto.volume }}"
                    placeholder="350ml, 600ml, 1L, 2L, 90g..."
                >

            </div>

            <div class="form-group">

                <label>
                    Preço de venda
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="preco_venda"
                    value="{{ produto.preco_venda }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Preço da caixa
                </label>
            
                <input
                    type="number"
                    step="0.01"
                    name="preco_caixa"
                    value="{{ produto.preco_caixa or '' }}"
                >
            
            </div>

            <div class="form-group">

                <label>
                    Quantidade por caixa
                </label>

                <input
                    type="number"
                    name="quantidade_por_caixa"
                    value="{{ produto.quantidade_por_caixa }}"
                    required
                >

            </div>

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="vende_por_dose"
                    name="vende_por_dose"
                    {% if produto.vende_por_dose %}checked{% endif %}
                >

                <label for="vende_por_dose">

                    Produto vendido por dose

                </label>

            </div>

            <div
                class="form-group"
                id="campo-dose"
            >

                <label>
                    Volume da dose (ml)
                </label>

                <input
                    type="number"
                    name="volume_dose_ml"
                    value="{{ produto.volume_dose_ml }}"
                >

            </div>

            <div
    class="form-group"
    id="campo-preco-dose"
    {% if not produto.vende_por_dose %}
    style="display:none;"
    {% endif %}
>

    <label>
        Preço da dose
    </label>

    <input
        type="number"
        step="0.01"
        name="preco_dose"
        value="{{ produto.preco_dose or '' }}"
    >

</div>

<div class="checkbox-group">

    <input
        type="checkbox"
        id="vende_por_unidade"
        name="vende_por_unidade"
        {% if produto.vende_por_unidade %}
        checked
        {% endif %}
    >

    <label for="vende_por_unidade">

        Produto vendido por unidade

    </label>

</div>



<div
    class="form-group"
    id="campo-preco-unidade"
    {% if not produto.vende_por_unidade %}
    style="display:none;"
    {% endif %}
>

    <label>
        Preço unitário
    </label>

    <input
        type="number"
        step="0.01"
        name="preco_unidade"
        value="{{ produto.preco_unidade or '' }}"
    >

</div>

<div
    class="form-group"
    id="campo-quantidade-unidade"
    {% if not produto.vende_por_unidade %}
    style="display:none;"
    {% endif %}
>

    <label>
        Quantidade por unidade
    </label>

    <input
        type="number"
        name="quantidade_por_unidade"
        value="{{ produto.quantidade_por_unidade or '' }}"
    >

</div>


            <div class="produto-form-actions">

                <a
                    href="/produto"
                    class="button button-secondary"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Voltar

                </a>

                <button
                    type="submit"
                    class="button button-success"
                >

                    <i class="fa-solid fa-floppy-disk"></i>

                    Salvar Alterações

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script
    src="{{ url_for(
        'static',
        filename='js/pages/produto.js'
    ) }}"
></script>

{% endblock %}
