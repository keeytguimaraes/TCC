<!DOCTYPE html>
{% extends "base/base.html" %}

{% block titulo %}
Editar Fornecedor
{% endblock %}

{% block conteudo %}

    <h1>
        Editar fornecedor
    </h1>

    <!-- FORMULÁRIO -->
    <form
        action="/fornecedor/editar/{{ fornecedor.id }}"
        method="POST"
    >

        <!-- Nome -->
        <label>
            Nome:
        </label>

        <input
            type="text"
            name="nome"
            value="{{ fornecedor.nome }}"
            required
        >

        <br><br>

        <!-- Telefone -->
        <label>
            Telefone:
        </label>

        <input
            type="text"
            name="telefone"
            value="{{ fornecedor.telefone }}"
        >

        <br><br>

        <!-- Observação -->
        <label>
            Observação:
        </label>

        <br>

        <textarea
            name="observacao"
            rows="5"
            cols="40"
        >{{ fornecedor.observacao }}</textarea>

        <br><br>

        <!-- Botão -->
        <button type="submit" class="button button-primary">
            <i class="fa-solid fa-floppy-disk"></i>
            Salvar Alterações
        </button>

    </form>

    <br>

    <!-- Voltar -->
    <a
    href="/fornecedor"
    class="button button-secondary"
>
    <i class="fa-solid fa-arrow-left"></i>
    Voltar
</a>

    {% endblock %}
