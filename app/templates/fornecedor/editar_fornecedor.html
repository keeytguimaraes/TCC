{% extends "base/base.html" %}

{% block titulo %}
Editar Fornecedor
{% endblock %}

{% block css %}

<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/components/acoes.css'
    ) }}"
>

<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/components/confirmar.css'
    ) }}"
>

<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/pages/fornecedor.css'
    ) }}"
>

{% endblock %}

{% block conteudo %}

<div class="pagina-fornecedores pagina-fornecedores--form">

    <header class="forn-cabecalho">

        <div>

            <h1 class="forn-titulo">
                Editar Fornecedor
            </h1>

            <p class="forn-subtitulo">
                Altere os dados de contato do fornecedor.
            </p>

        </div>

    </header>

    <div class="editar-card forn-painel">

        <form
            action="/fornecedor/editar/{{ fornecedor.id }}"
            method="POST"
        >

            <div class="form-group forn-campo">

                <label for="edit-nome">
                    Nome <span class="forn-obrig" aria-hidden="true">*</span>
                </label>

                <input
                    type="text"
                    id="edit-nome"
                    name="nome"
                    value="{{ fornecedor.nome or '' }}"
                    required
                >

            </div>

            <div class="form-group forn-campo">

                <label for="edit-telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="edit-telefone"
                    name="telefone"
                    value="{{ fornecedor.telefone or '' }}"
                    inputmode="tel"
                >

            </div>

            <div class="form-group forn-campo">

                <label for="edit-observacao">
                    Observação
                </label>

                <textarea
                    id="edit-observacao"
                    name="observacao"
                    rows="5"
                >{{ fornecedor.observacao or '' }}</textarea>

            </div>

            <div class="editar-acoes forn-acoes">

                <a
                    href="/fornecedor"
                    class="btn btn-cancelar"
                >
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    Voltar
                </a>

                <button
                    type="submit"
                    class="btn btn-salvar"
                >
                    <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                    Salvar Alterações
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
